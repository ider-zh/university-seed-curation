name: Offline reference checks

on:
  push:
    branches: [main, codex/initial-design]
  pull_request:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python .agents/skills/university-curation/scripts/maintain_schema.py check
      - run: python -m unittest discover -s tests -v

# Read-only prototype checks. This is NOT a trusted review-attestation or
# auto-merge workflow, and it does not publish private outputs or artifacts.
