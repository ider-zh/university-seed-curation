name: Reviewed university data

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  signed-data-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out proposed tree as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: proposed
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install only trusted base code
        run: python -m pip install ./trusted
      - name: Validate exact proposed blobs against base trust
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python trusted/.agents/skills/university-curation/scripts/curate.py pr-validate
          --workspace proposed --base-ref "$BASE_SHA" --head-ref HEAD
          --expected-head-sha "$HEAD_SHA"

# No secrets, candidate Python execution, model calls, publication or merge.
# This workflow activates after its code PR is merged onto the base branch.
# Branch protection/required-check setup is a separate operator-visible step.
