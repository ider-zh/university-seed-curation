name: University review status

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# Every run scans all active PRs. Serialize runs so an older evaluation cannot
# overwrite a newer objection failure; superseded pending events are covered
# by the next complete scan.
concurrency:
  group: university-review-status
  cancel-in-progress: false

jobs:
  trusted-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install trusted dependencies
        run: python -m pip install .
      - name: Evaluate signed review status
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .agents/skills/university-curation/scripts/event_review.py --mode status --scan
