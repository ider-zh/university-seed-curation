name: Data publication validation
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  data-publication:
    name: data-publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Validate generated data using trusted base code
        env:
          PR_NUMBER: ${{ github.event.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: .agents/skills/university-curation/scripts/lib
        run: |
          python -m pip install -e .
          git fetch origin "pull/$PR_NUMBER/head:refs/pr/head" "pull/$PR_NUMBER/merge:refs/pr/merge"
          python -m university_curation.pr_validation "$BASE_SHA" refs/pr/head refs/pr/merge
