name: University review queue dispatch

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  metadata-only-queue:
    if: ${{ vars.UNIVERSITY_EVENT_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install trusted dependencies
        run: python -m pip install .
      - name: Enqueue verified Draft heads
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python .agents/skills/university-curation/scripts/event_review.py --mode queue --scan
          else
            python .agents/skills/university-curation/scripts/event_review.py --mode queue
          fi
